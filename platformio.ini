; ======================================================================
;  T-Embed CC1101 dual-boot launcher  (clean, standalone project)
; ======================================================================
;  A cold boot always lands in this PIN-locked launcher; from there you pick
;  Bruce or Flipper. The custom 2nd-stage bootloader (bootloader/bootloader.bin)
;  is what forces the launcher on every reset except a software restart.
;
;  The custom arduino-libs package is MANDATORY: it is built with
;  CONFIG_SPI_FLASH_DANGEROUS_WRITE_ALLOWED=y so the launcher may write the
;  partition table / OTA data. The stock package aborts on that write.
;
;  Build:   pio run
;  One-file image + kit:   python tools/build_everything.py
; ----------------------------------------------------------------------

[platformio]
boards_dir = boards

[env:lilygo-t-embed-cc1101]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
	framework-arduinoespressif32-libs @ https://github.com/bmorcelli/myLibBuilder/releases/download/builds/launcher_esp32-arduino-libs-20260807-031549.tar.gz
framework = arduino
board = lilygo-t-embed-cc1101

board_build.variants_dir = boards
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Arduino_GFX is vendored in lib/. The encoder is decoded inline (no extra lib).
lib_ldf_mode = deep+

; The Wi-Fi upload portal uses the framework's WiFi/WebServer libraries. On ESP32 Arduino core
; 3.x those include <Network.h>, whose folder the dependency finder does not add on its own, so
; the include path is given explicitly below (see build_flags).

build_flags =
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
	-DT_EMBED_1101=1
	-DBOARD_HAS_PSRAM=1
	-DST7789_DRIVER=1
	-DCORE_DEBUG_LEVEL=0
	-Os
	-ffunction-sections
	-fdata-sections
	-fno-exceptions
	-Wl,--gc-sections
