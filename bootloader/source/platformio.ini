; Minimal ESP-IDF project whose only purpose is producing a custom bootloader.bin
; for the Lilygo T-Embed CC1101. The app it builds is throwaway - we only keep
; .pio/build/bootloader/bootloader.bin and flash that to 0x0 on the device.
;
; The platform URL is pinned to the exact same release the Launcher uses, so the
; bootloader is built from the same ESP-IDF version as the firmware it will boot.

[env:bootloader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1

; Must match how the Launcher/Bruce images are flashed: 16MB, QIO, 80MHz.
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
